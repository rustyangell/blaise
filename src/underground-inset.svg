<!-- Youth Underground, the lower level of the Educational Building (300), drawn as one solid box.
     The whole graphic is one clickable target (data-building="youth-underground"). -->
<svg class="campus-inset-svg" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
  <g data-building="youth-underground">
    <rect class="inset-bg" x="4" y="4" width="312" height="292" rx="12"/>
    <rect class="inset-room" x="30" y="40" width="260" height="200" rx="6"/>
    <g class="inset-entrance">
      <circle cx="65" cy="268" r="16"/>
      <path d="M65 250 V278 M57 266 L65 274 L73 266" transform="translate(0,-4)"/>
    </g>
  </g>
  <g class="campus-labels inset-labels" aria-hidden="true">
    <text x="160" y="24">Youth Underground</text>
    <text class="inset-rooms" x="160" y="140">Rooms 309&#8211;314</text>
    <text class="campus-entrance-label" x="180" y="272">Entrance (stairs)</text>
  </g>
</svg>
